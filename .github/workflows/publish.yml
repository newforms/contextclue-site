# Publishes site/ to Opalstack with scripts/publish.sh: main → contextclue.app, every other branch →
# preview.contextclue.app/<branch>/, and a deleted branch takes its preview with it.
#
# Needs the repository secret DEPLOY_SSH_KEY: the private half of the key in the contextclue shell
# user's ~/.ssh/authorized_keys. The server's host key is pinned in .github/opal4_known_hosts, so a
# changed key fails the run instead of being trusted.
name: Publish

on:
  push:
    branches: ['**']
  delete:

permissions:
  contents: read

# One run per branch at a time; a newer push replaces a run still waiting.
concurrency:
  group: publish-${{ github.event.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The hooks only run where someone switched them on. This checks every tracked file again,
      # so a design file or a huge video that slipped past them is never published.
      - name: Check paths
        run: |
          git ls-files -z | while IFS= read -r -d '' path; do
            printf '%s\t%s\n' "$path" "$(stat -c %s "$path")"
          done | scripts/guard-paths.sh

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          cp .github/opal4_known_hosts ~/.ssh/known_hosts
          printf 'Host opal4.opalstack.com\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config

      - name: Publish
        run: scripts/publish.sh publish "$GITHUB_REF_NAME"

  remove-preview:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          cp .github/opal4_known_hosts ~/.ssh/known_hosts
          printf 'Host opal4.opalstack.com\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config

      - name: Remove preview
        env:
          BRANCH: ${{ github.event.ref }}
        run: scripts/publish.sh remove "$BRANCH"
